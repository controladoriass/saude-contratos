<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- evita cache: navegador sempre busca a versão mais recente -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Saúde dos Contratos · Silva &amp; Silva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#09001e; --bg2:#0d0326; --card:#161a33; --card2:#1e223f;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --txt:#dfe1ea; --muted:#9fa4ba; --muted2:#828aa3;
  --gold:#cfa36e; --gold-soft:rgba(207,163,110,.14);
  --ok:#4bbf73; --ok-bg:rgba(46,125,50,.16);
  --warn:#e0b341; --warn-bg:rgba(201,150,42,.16);
  --crit:#e0604f; --crit-bg:rgba(192,57,43,.18);
  --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.35);
  --font:'Montserrat',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#160a3a 0,var(--bg) 55%) fixed,var(--bg);
  color:var(--txt);font-family:var(--font);padding-block:clamp(20px,4vw,42px);padding-inline:clamp(16px,4vw,44px);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px;
  padding-bottom:22px;margin-bottom:20px}
.titlewrap{display:flex;flex-direction:column;gap:16px}
.logo{height:clamp(38px,5vw,54px);width:auto;object-fit:contain}
h1{font-weight:800;font-size:clamp(26px,4.5vw,42px);letter-spacing:-.01em}
.stamp{color:var(--muted2);font-size:12.5px;text-align:right;padding-top:4px}
.stamp b{color:var(--txt);font-weight:600}

/* ---------- KPIs (cards em colunas) ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:34px}
.kpi{background:var(--card);border:1px solid var(--line2);border-radius:0;padding:18px 20px;
  display:flex;flex-direction:column;gap:10px;min-height:104px}
.kpi .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2)}
.kpi .val{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:auto}
.kpi .val small{font-size:15px;font-weight:600;color:var(--muted)}
.kpi.accent{background:linear-gradient(160deg,rgba(207,163,110,.14),var(--card));border-color:rgba(207,163,110,.32)}
.kpi.accent .val{color:var(--gold)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.na{background:var(--muted2)}

/* ---------- section title ---------- */
.sec{display:flex;align-items:baseline;gap:12px;margin:8px 0 14px}
.sec h2{font-size:15px;font-weight:700;letter-spacing:.02em}
.sec .hint{color:var(--muted2);font-size:12.5px}

/* ---------- filtros ---------- */
.filtros{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin-bottom:16px}
.fgrupo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2)}
.fchip{background:transparent;border:1px solid var(--line2);color:var(--muted);border-radius:999px;
  padding:6px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .15s}
.fchip:hover{border-color:var(--gold);color:var(--txt)}
.fchip.on{background:var(--gold);border-color:var(--gold);color:#1a1305;font-weight:700}
.fcount{font-size:12.5px;color:var(--muted2);margin-left:auto}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:820px}
thead th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);
  text-align:left;padding:14px 16px;border-bottom:1px solid var(--line2);font-weight:600;white-space:nowrap}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--txt)}
thead th .arrow{opacity:.5;font-size:9px;margin-left:4px}
thead th.sorted .arrow{opacity:1;color:var(--gold)}
tbody td{padding:15px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:rgba(255,255,255,.03)}
tbody tr:last-child td{border-bottom:0}
.cli{font-weight:700;font-size:14.5px}
.cli small{display:block;color:var(--muted2);font-weight:500;font-size:12px;margin-top:2px}
.tag{display:inline-block;font-size:12px;color:var(--muted)}

/* barra de uso */
.bar{position:relative;height:5px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;max-width:170px}
.bar > i{position:absolute;inset:0 auto 0 0;border-radius:999px;display:block}
.usepct{font-weight:700;font-size:14px;margin-bottom:6px}
.usepct small{color:var(--muted2);font-weight:500}

/* farol: bolinha + texto (leve, sem moldura) */
.farol{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap}
.farol::before{content:"";width:9px;height:9px;border-radius:50%;flex:none;background:currentColor;
  box-shadow:0 0 0 4px color-mix(in srgb,currentColor 16%,transparent)}
.farol.ok{color:var(--ok)}
.farol.warn{color:var(--warn)}
.farol.crit{color:var(--crit)}
.farol.na{color:var(--muted2)}
.rec{font-size:13px;max-width:42ch;line-height:1.45}
.rec b{color:var(--txt)}
.chev{color:var(--muted2);font-size:18px}

/* ---------- empty ---------- */
.empty{border:1px dashed var(--line2);border-radius:var(--radius);padding:26px;color:var(--muted);
  text-align:center;background:rgba(255,255,255,.02);margin-top:10px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,0,18,.72);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);
  width:min(760px,100%);max-height:90vh;overflow:auto;padding:26px clamp(18px,3vw,30px)}
.modal .x{float:right;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:8px;
  width:34px;height:34px;font-size:18px;cursor:pointer}
.modal .x:hover{color:var(--txt);border-color:var(--gold)}
.modal h3{font-size:22px;font-weight:800}
.modal .msub{color:var(--muted);font-size:13px;margin-top:4px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:2px 26px;margin:22px 0;
  padding-top:16px;border-top:1px solid var(--line)}
.mstat{padding:6px 0}
.mstat .l{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2)}
.mstat .v{font-size:22px;font-weight:800;margin-top:6px}
.recbox{border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 10px 10px 0;
  padding:14px 16px;font-size:13.5px;line-height:1.55;margin-top:6px}
.recbox .rtitle{font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.chartwrap{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.chartwrap .ctitle{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px}
.cabas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cabas button{background:transparent;border:1px solid var(--line2);color:var(--muted);border-radius:7px;
  padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.cabas button:hover{border-color:var(--gold);color:var(--txt)}
.cabas button.sel{background:var(--gold);border-color:var(--gold);color:#1a1305;font-weight:700}
svg{display:block;max-width:100%}

/* KPIs clicáveis */
.kclick{cursor:pointer;transition:transform .12s,border-color .15s}
.kclick:hover{transform:translateY(-2px);border-color:var(--line2)}
.kpi.accent.kclick:hover{border-color:rgba(207,163,110,.5)}

/* barra de ferramentas da lista (marcar todos + PDF) */
.listtools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;
  padding-bottom:10px;border-bottom:1px solid var(--line)}
.chkall{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.chkall input,.lchk{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
.btnpdf{background:var(--gold);color:#1a1305;border:0;border-radius:8px;font-weight:700;font-size:13px;
  padding:9px 16px;cursor:pointer;font-family:inherit}
.btnpdf:hover{filter:brightness(1.08)}

/* lista de clientes dentro do modal */
.lista{display:flex;flex-direction:column;margin-top:6px}
.listrow{display:flex;align-items:center;gap:12px;width:100%;
  border-bottom:1px solid var(--line);color:var(--txt);
  padding:12px 4px;font-size:14px;border-radius:8px}
.listrow:hover{background:rgba(255,255,255,.04)}
.listrow:last-child{border-bottom:0}
.listrow .lnome{flex:1;font-weight:600;cursor:pointer}
.listrow .linfo{color:var(--muted);font-size:13px;white-space:nowrap;cursor:pointer}
.listrow .chev{flex:none;cursor:pointer;color:var(--muted2)}
/* card de excedentes por faixa de fechamento */
.exlista{margin-top:14px}
.faixa{margin-bottom:18px}
.faixa-h{display:flex;justify-content:space-between;align-items:baseline;
  font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);
  border-bottom:1px solid var(--line2);padding-bottom:7px;margin-bottom:4px}
.faixa-v{color:var(--gold);font-weight:700;font-size:14px;letter-spacing:0}
.exrow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:16px;
  padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.exrow:hover{background:rgba(255,255,255,.04)}
.exrow:last-child{border-bottom:0}
.exnome{font-weight:600;font-size:13.5px}
.exdata{font-size:12px;color:var(--muted2);white-space:nowrap;font-variant-numeric:tabular-nums}
.exval{font-weight:700;font-size:13.5px;color:var(--crit);white-space:nowrap;min-width:96px;text-align:right}
/* muitos clientes (>10): compacta as linhas e rola dentro da própria lista */
.lista.compacta{max-height:52vh;overflow-y:auto;padding-right:4px}
.lista.compacta .listrow{padding:7px 4px;font-size:13px;gap:10px}
.lista.compacta .listrow .linfo{font-size:12px}
.lista.compacta .farol{font-size:12px}
.lista.compacta .farol::before{width:8px;height:8px;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 16%,transparent)}

@media (max-width:640px){
  .stamp{text-align:left}
  header{align-items:flex-start}
  .listrow .linfo{display:none}
}
</style>
</head>

<header>
  <div class="titlewrap">
    <img class="logo" src="logo.png" alt="Silva &amp; Silva Advogados">
  </div>
  <div class="stamp">

<section class="kpis" id="kpis"></section>

  </div>
  <span class="fcount" id="fcount"></span>
</div>

<div class="tablewrap">
  <table>
    <thead>
      <tr>
        <th class="sortable" data-sort="nome">Cliente</th>
        <th class="sortable" data-sort="periodicidade">Contrato</th>
        <th class="sortable" data-sort="uso">Consumo do banco</th>

        <th class="sortable" data-sort="situacao">Situação</th>
        <th>Recomendação</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div class="empty" id="empty" hidden>Nenhum cliente carregado ainda. Adicione os dados em <code>dados.json</code>.</div>

<!-- modal detalhe -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

/* ================= LÓGICA DE NEGÓCIO =================
   Farol e recomendação por PROJEÇÃO de estouro.
   proj = ritmo (util / semanas decorridas) * total de semanas do período.
   - CRÍTICO (vermelho): já excedeu, OU projeção >= 100% do banco  -> aditivo/cobrança
   - ATENÇÃO (amarelo):  projeção entre 80% e 100%                 -> monitorar
   - SAUDÁVEL (verde):   projeção < 80%                            -> seguir
   Toda recomendação explica o porquê em números.                       */

// horas em formato real HH:MM (ex: 56:57). Aceita negativo (ex: -11:57 para saldo estourado).
const fmtH = h => {
  if(h===null||h===undefined||isNaN(h)) return '—';
  const neg=h<0; let m=Math.round(Math.abs(h)*60);
  const hh=Math.floor(m/60), mm=m%60;
  return (neg?'-':'')+hh+':'+String(mm).padStart(2,'0');
};
const fmtR = v => 'R$ '+ (Math.round(v*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct  = (a,b) => b? (a/b*100):0;

function analisa(c){
  // cliente sem valor de banco contratado na planilha: não dá para projetar
  if (c.sem_banco || !c.contratadas){
    return {usoPct:0, projPct:0, nivel:'na', farolTxt:'Sem banco',
      rtitle:'Banco não informado',
      rec:`A planilha deste cliente não traz o total de horas contratadas, então não é possível calcular consumo nem projeção. Foram lançadas <b>${fmtH(c.utilizadas)}</b> no período. Convém completar o cadastro do contrato para entrar no acompanhamento.`};
  }
  const usoPct  = pct(c.utilizadas, c.contratadas);
  const projPct = pct(c.proj, c.contratadas);
  const excedeuAgora = c.utilizadas > c.contratadas || (c.excedidas||0) > 0;
  // unidade da série: contratos medidos por mês x por semana
  const un = (c.periodicidade==='Trimestral' && (c.serie||[]).length<=4) || c.periodicidade==='Anual'
             ? 'por mês' : 'por semana';
  let nivel, farolTxt, rec, rtitle;

  if (excedeuAgora || projPct >= 100){
    nivel='crit'; farolTxt='Possível aditivo';
    const horasEstouro = Math.max(c.proj - c.contratadas, c.utilizadas - c.contratadas);
    rtitle='Sinaliza possível aditivo';
    if (excedeuAgora){
      // valor de AUDITORIA: o R$ que a planilha calcula (valor_excedido). Fallback: horas × valor_hora.
      const valReal = (c.valor_excedido!=null && c.valor_excedido>0) ? c.valor_excedido
                    : (c.valor_hora ? (c.utilizadas-c.contratadas)*c.valor_hora : null);
      const rs = valReal!=null ? fmtR(valReal) : null;
      const hExc = c.excedidas>0 ? c.excedidas : (c.utilizadas-c.contratadas);
      rec = `O consumo já passou do banco de ${fmtH(c.contratadas)} (<b>${fmtH(c.utilizadas)}</b> lançadas). Já há <b>${fmtH(hExc)}</b> de horas excedentes${rs?`, no valor de <b>${rs}</b> (conforme a planilha)`:''}, o que sinaliza um possível aditivo de horas para o próximo ciclo.`;
    } else {
      const rs = (horasEstouro>0 && c.valor_hora) ? fmtR(horasEstouro*c.valor_hora) : null;
      rec = `No ritmo de <b>${fmtH(c.ritmo)} ${un}</b>, a projeção é fechar o período em <b>${fmtH(c.proj)}</b>, acima do banco de ${fmtH(c.contratadas)}. Se seguir assim, há cerca de <b>${fmtH(horasEstouro)}</b> de horas excedentes previstas${rs?` (aproximadamente <b>${rs}</b>)`:''}: cenário que sinaliza um possível aditivo.`;
    }
  } else if (projPct >= 80){
    nivel='warn'; farolTxt='Atenção';
    rtitle='Caminho de atenção';
    rec = `No ritmo de <b>${fmtH(c.ritmo)} ${un}</b>, a projeção é fechar em <b>${fmtH(c.proj)}</b> (<b>${projPct.toFixed(0)}%</b> do banco). Ainda dentro do contratado, mas seguindo nesse caminho fica próximo do limite; convém acompanhar a curva nas próximas semanas.`;
  } else {
    nivel='ok'; farolTxt='Saudável';
    rtitle='Dentro do contratado';
    rec = `No ritmo de <b>${fmtH(c.ritmo)} ${un}</b>, a projeção é fechar em <b>${fmtH(c.proj)}</b> (<b>${projPct.toFixed(0)}%</b> do banco de ${fmtH(c.contratadas)}). Seguindo nesse fluxo, o consumo permanece confortável dentro do contratado.`;
  }
  return {usoPct, projPct, nivel, farolTxt, rec, rtitle};
}

let CLIENTES=[], ANS=[];

function renderKpis(clientes, an){

  k.querySelectorAll('.kclick').forEach(el=>el.onclick=()=>abreLista(el.dataset.f));
}

const ordem={crit:0,warn:1,ok:2,na:3};

const TITULOS={todos:'Todos os clientes contratados',ok:'Clientes saudáveis',
  warn:'Clientes em atenção',crit:'Clientes com sugestão de aditivo',exc:'Clientes com excedente previsto'};

// data de fechamento do ciclo atual (dd/mm/aaaa) -> Date
function dataFechamento(c){
  const cs=c.ciclos||[];
  const at=cs.find(x=>x.atual)||cs[cs.length-1];
  const fim=at&&at.fim; if(!fim) return null;
  const m=String(fim).match(/(\d{2})\/(\d{2})\/(\d{4})/);
  return m? new Date(+m[3],+m[2]-1,+m[1]) : null;
}
function diasAte(dt){ if(!dt) return null; return Math.round((dt-new Date(new Date().toDateString()))/86400000); }
const DIAS_BOLETO=10; // prazo médio entre o fechamento e o recebimento do boleto
// previsão de RECEBIMENTO = fim do ciclo + prazo do boleto
function dataRecebimento(c){
  const dt=dataFechamento(c); if(!dt) return null;
  const r=new Date(dt); r.setDate(r.getDate()+DIAS_BOLETO); return r;
}
// excedente do ÚLTIMO ciclo (o atual): aberto OU recém-fechado ainda a receber
function excedenteAtual(c){
  const cs=c.ciclos||[]; const at=cs.find(x=>x.atual)||cs[cs.length-1];
  return at? (at.valor_excedido||0) : 0;
}

// vista do card excedente: faixas por DATA DE FECHAMENTO do ciclo
function abreExcedentes(){
  const itens=[];
  CLIENTES.forEach((c,i)=>{
    const v=excedenteAtual(c);
    if(v>0){ const dtFim=dataFechamento(c); itens.push({c,i,v,dtFim,dias:diasAte(dtFim)}); }
  });
  const faixas=[
    {t:'Ciclo já fechado', test:x=> x.dias!=null && x.dias<0},
    {t:'Fecha em até 15 dias', test:x=> x.dias!=null && x.dias>=0 && x.dias<=15},
    {t:'Fecha em 16 a 30 dias', test:x=> x.dias!=null && x.dias>15 && x.dias<=30},
    {t:'Fecha em 31 a 60 dias', test:x=> x.dias!=null && x.dias>30 && x.dias<=60},
    {t:'Fecha em mais de 60 dias', test:x=> x.dias!=null && x.dias>60},
    {t:'Sem data de fechamento', test:x=> x.dias==null},
  ];
  const total=itens.reduce((s,x)=>s+x.v,0);
  let html='';
  faixas.forEach(fx=>{
    const grupo = itens.filter(fx.test).sort((a,b)=>(a.dias??9e9)-(b.dias??9e9));
    if(!grupo.length) return;
    const soma=grupo.reduce((s,x)=>s+x.v,0);
    html+=`<div class="faixa"><div class="faixa-h"><span>${fx.t} · ${grupo.length}</span><span class="faixa-v tnum">${fmtR(soma)}</span></div>`;
    grupo.forEach(x=>{
      const dtxt = x.dtFim ? `fecha ${x.dtFim.toLocaleDateString('pt-BR')}` : 'sem data';
      html+=`<div class="exrow" data-open="${x.i}">
        <span class="exnome" data-open="${x.i}">${x.c.nome}</span>
        <span class="exdata" data-open="${x.i}">${dtxt}</span>
        <span class="exval tnum" data-open="${x.i}">${fmtR(x.v)}</span></div>`;
    });
    html+='</div>';
  });
  const m=document.getElementById('modal');
  m.innerHTML=`
    <button class="x" onclick="fecha()" aria-label="Fechar">×</button>
    <h3>Excedente previsto no ciclo</h3>
    <div class="msub">Total ${fmtR(total)} em ${itens.length} cliente(s) · agrupado pela data de fechamento do ciclo</div>
    <div class="exlista">${html||'<div style="color:var(--muted);padding:16px 0">Nenhum cliente com excedente no ciclo atual.</div>'}</div>`;
  m.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{ const i=+el.dataset.open; abreModal(CLIENTES[i],ANS[i]); });
  document.getElementById('overlay').classList.add('on');
}

function abreLista(f){
  if(f==='exc'){ return abreExcedentes(); }
  const linhas=[];
  CLIENTES.forEach((c,i)=>{
    const a=ANS[i];
    let inc=false;
    if(f==='todos') inc=true;
    else inc=(a.nivel===f);
    if(inc) linhas.push({c,a});
  });
  // ordena por % usado desc
  linhas.sort((x,y)=>y.a.usoPct-x.a.usoPct);
  const m=document.getElementById('modal');
  const itens = linhas.map(({c,a})=>{
    const idx=CLIENTES.indexOf(c);
    const badge = a.nivel==='na' ? '' : `<span class="farol ${a.nivel}">${a.farolTxt}</span>`;
    const info = c.contratadas
      ? `${a.usoPct.toFixed(0)}% <span style="color:var(--muted2)">de ${fmtH(c.contratadas)}</span>`
      : `${fmtH(c.utilizadas)} lançadas`;
    return `<div class="listrow" data-i="${idx}">
      <input type="checkbox" class="lchk" data-i="${idx}" aria-label="Selecionar ${c.nome}">
      <span class="lnome" data-open="${idx}">${c.nome}</span>
      <span class="linfo tnum" data-open="${idx}">${info}</span>
      ${badge}<span class="chev" data-open="${idx}">›</span></div>`;
  }).join('');
  m.innerHTML=`
    <button class="x" onclick="fecha()" aria-label="Fechar">×</button>
    <h3>${TITULOS[f]}</h3>
    <div class="msub">${linhas.length} ${linhas.length===1?'cliente':'clientes'} · marque os que quer exportar</div>
    <div class="listtools">
      <label class="chkall"><input type="checkbox" id="chkAll"> Marcar todos</label>
      <button class="btnpdf" id="btnPdf">Salvar seleção em PDF</button>
    </div>
    <div class="lista${linhas.length>10?' compacta':''}">${itens||'<div style="color:var(--muted);padding:16px 0">Nenhum cliente neste grupo.</div>'}</div>`;
  // clicar no nome/info abre o detalhe; o checkbox não abre
  m.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{
    const i=+el.dataset.open; abreModal(CLIENTES[i],ANS[i]);
  });
  const all=m.querySelector('#chkAll');
  if(all) all.onchange=()=>m.querySelectorAll('.lchk').forEach(ch=>ch.checked=all.checked);
  const btn=m.querySelector('#btnPdf');
  if(btn) btn.onclick=()=>{
    let sel=[...m.querySelectorAll('.lchk:checked')].map(ch=>+ch.dataset.i);
    if(!sel.length) sel=linhas.map(({c})=>CLIENTES.indexOf(c)); // nada marcado = todos
    gerarPDF(TITULOS[f], sel);
  };
  document.getElementById('overlay').classList.add('on');
}

/* ===== PDF via impressão do navegador — cards compactos, 2 colunas (2-3 por folha) ===== */
function gerarPDF(titulo, indices){
  const hoje=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  const corNivel={crit:'#c0392b',warn:'#c9962a',ok:'#2e7d32',na:'#888'};
  const cards=indices.map(i=>{
    const c=CLIENTES[i], a=ANS[i];
    const cic=cicloDatas(c);
    const vig = cic?`${cic.ini} a ${cic.fim}`:`período ${c.sem_now} de ${c.sem_total}`;
    const cor=corNivel[a.nivel]||'#888';
    // pílulas resumidas (chave: valor)
    const pill=(k,v)=>`<span class="pill"><b>${k}</b> ${v}</span>`;
    const pills=[
      pill('Contrato', `${c.periodicidade}`),
      pill('Vigência', vig),
      pill('Contratadas', c.contratadas!=null?fmtH(c.contratadas):'—'),
      pill('Utilizadas', fmtH(c.utilizadas)),
      pill('% usado', c.contratadas?a.usoPct.toFixed(0)+'%':'—'),
      pill('Restantes', c.restantes!=null?fmtH(c.restantes):'—'),
      (c.excedidas>0?pill('Excedidas', fmtH(c.excedidas)):''),
      ((c.valor_excedido!=null&&c.valor_excedido>0)?pill('A cobrar', fmtR(c.valor_excedido)):''),
      pill('Projeção', fmtH(c.proj)+(c.contratadas?` (${a.projPct.toFixed(0)}%)`:'')),
    ].filter(Boolean).join('');
    return `<section class="pcard">
      <div class="pctitle"><span class="pname">${c.nome}</span>

  const win=window.open('','_pdf');
  win.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">

      .phead h1{font-size:16px;margin:0;color:#1f3864} .phead .sub{font-size:11px;color:#555;text-align:right}
      .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .pcard{border:1px solid #ccc;border-radius:6px;padding:10px 12px;page-break-inside:avoid;break-inside:avoid}
      .pctitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
      .pname{font-size:12.5px;font-weight:700;color:#1f3864;line-height:1.2}
      .pstatus{font-size:10.5px;font-weight:700;white-space:nowrap}
      .ppills{display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:7px}
      .pill{font-size:10px;color:#333;background:#f2f2f4;border-radius:4px;padding:2px 6px;white-space:nowrap}
      .pill b{color:#777;font-weight:600}
      .prec{font-size:10px;color:#333;margin:0;line-height:1.4;border-left:2px solid #cfa36e;padding:5px 8px;background:#f6f3ee}
      @media print{ body{padding:0} }
    </style></head><body>
    <div class="phead"><h1>Saúde dos Contratos · ${titulo}</h1>
      <div class="sub">Silva &amp; Silva Advogados · ${indices.length} cliente(s)<br>${hoje}</div></div>
    <div class="grid">${cards}</div>
    <script>window.onload=()=>{setTimeout(()=>window.print(),300)}<\/script>

}

// estado de filtro e ordenação
let FILTRO={periodicidade:'todos', situacao:'todos'};
let SORT={col:'situacao', dir:1};   // dir: 1 = padrão (situação: crítico->ok); ao clicar inverte
const ordemPeri={Mensal:0,Trimestral:1,Semestral:2,Anual:3};

function valorSort(c,a,col){
  switch(col){
    case 'nome': return c.nome.toLowerCase();
    case 'periodicidade': return ordemPeri[c.periodicidade] ?? 9;
    case 'uso': return a.usoPct||0;
    case 'proj': return a.projPct||0;
    case 'situacao': return ordem[a.nivel];   // crit<warn<ok<na
    default: return 0;
  }
}

function renderTabela(clientes, ans){
  const tb=document.getElementById('tbody'); tb.innerHTML='';
  // filtra
  let idx=[...clientes.keys()].filter(i=>{
    const c=clientes[i], a=ans[i];
    if(FILTRO.periodicidade!=='todos' && c.periodicidade!==FILTRO.periodicidade) return false;
    if(FILTRO.situacao!=='todos' && a.nivel!==FILTRO.situacao) return false;
    return true;
  });
  // ordena
  idx.sort((x,y)=>{
    const vx=valorSort(clientes[x],ans[x],SORT.col), vy=valorSort(clientes[y],ans[y],SORT.col);
    let cmp = (vx<vy?-1:vx>vy?1:0);
    // desempate por % usado desc quando ordenando por situação
    if(cmp===0 && SORT.col==='situacao') cmp = (ans[y].usoPct||0)-(ans[x].usoPct||0);
    return cmp*SORT.dir;
  });
  idx.forEach(i=>{
    const c=clientes[i], a=ans[i];
    const semBanco = a.nivel==='na';
    const consumo = semBanco
      ? `<div class="usepct tnum" style="color:var(--muted2)">${fmtH(c.utilizadas)} lançadas</div>`
      : `<div class="usepct tnum">${a.usoPct.toFixed(1)}% <small>· ${fmtH(c.utilizadas)} de ${fmtH(c.contratadas)}</small></div>
         <div class="bar"><i style="width:${Math.min(a.usoPct,100)}%;background:${barColor(a.nivel)}"></i></div>`;
    const proj = semBanco ? '<span style="color:var(--muted2)">—</span>'
      : `${fmtH(c.proj)} <small style="color:var(--muted2)">(${a.projPct.toFixed(0)}%)</small>`;
    const tr=document.createElement('tr');
    tr.onclick=()=>abreModal(c,a);
    tr.innerHTML=`
      <td><div class="cli">${c.nome}</div></td>
      <td><span class="tag">${c.periodicidade}${c.contratadas?' · '+fmtH(c.contratadas):''}</span></td>
      <td>${consumo}</td>
      <td class="tnum">${proj}</td>
      <td><span class="farol ${a.nivel}">${a.farolTxt}</span></td>
      <td class="rec">${a.rec.replace(/<b>|<\/b>/g,'')}</td>
      <td class="chev">›</td>`;
    tb.appendChild(tr);
  });
  // contador e setas de ordenação
  const fc=document.getElementById('fcount');
  if(fc) fc.textContent = `${idx.length} de ${clientes.length} clientes`;
  document.querySelectorAll('thead th.sortable').forEach(th=>{
    const on = th.dataset.sort===SORT.col;
    th.classList.toggle('sorted',on);
    let ar=th.querySelector('.arrow'); if(!ar){ar=document.createElement('span');ar.className='arrow';th.appendChild(ar);}
    ar.textContent = on ? (SORT.dir>0?' ▲':' ▼') : ' ⇅';
  });
}

function ligarControles(){
  // filtros de periodicidade
  document.querySelectorAll('[data-fp]').forEach(b=>b.onclick=()=>{
    FILTRO.periodicidade=b.dataset.fp;
    document.querySelectorAll('[data-fp]').forEach(x=>x.classList.toggle('on',x===b));
    renderTabela(CLIENTES,ANS);
  });
  // filtros de situação
  document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{
    FILTRO.situacao=b.dataset.fs;
    document.querySelectorAll('[data-fs]').forEach(x=>x.classList.toggle('on',x===b));
    renderTabela(CLIENTES,ANS);
  });
  // ordenação por cabeçalho
  document.querySelectorAll('thead th.sortable').forEach(th=>th.onclick=()=>{
    const col=th.dataset.sort;
    if(SORT.col===col) SORT.dir*=-1; else { SORT.col=col; SORT.dir = (col==='nome'||col==='periodicidade')?1:-1; }
    renderTabela(CLIENTES,ANS);
  });
}

// extrai todas as datas dd/mm/aaaa de um texto
function datasDe(txt){ return (String(txt||'').match(/\d{2}\/\d{2}\/\d{4}/g))||[]; }
// ciclo do contrato: 1a data do 1o item da série ... última data do último item
function cicloDatas(c){
  const s=c.serie||[]; if(!s.length) return null;
  const ini=datasDe(s[0].periodo)[0];
  const finArr=datasDe(s[s.length-1].periodo);
  const fim=finArr[finArr.length-1];
  return (ini&&fim)?{ini,fim}:null;
}
// último período com lançamento (>0) -> "desde a última atualização"
function ultimoLancado(c){
  const s=(c.serie||[]).filter(x=>x.util&&x.util>0);
  if(!s.length) return null;
  const d=datasDe(s[s.length-1].periodo);
  return d.length?d[d.length-1]:null;
}

// unidade de medida do ciclo pela periodicidade
function unidadeCiclo(c){
  return (c.periodicidade==='Trimestral' && (c.serie||[]).length<=4) || c.periodicidade==='Semestral' || c.periodicidade==='Anual' ? 'mês' : 'semana';
}
// texto de vigência legível: "vigência 18/06/2026 a 17/09/2026 · atualmente no 3º mês de 3"
function ordinalCiclo(c){
  const un=unidadeCiclo(c);
  if(!(c.sem_now && c.sem_total)) return '';
  return un==='mês' ? `no ${c.sem_now}º mês de ${c.sem_total}` : `na ${c.sem_now}ª semana de ${c.sem_total}`;
}
function vigenciaTxt(c){
  const cic=cicloDatas(c);
  const pos = ordinalCiclo(c) ? ` · atualmente ${ordinalCiclo(c)}` : '';
  if(cic) return `vigência ${cic.ini} a ${cic.fim}${pos}`;
  return `${c.sem_now||'?'} de ${c.sem_total||'?'}`;
}

// analisa um CICLO específico (usa contratadas/valor_hora do próprio ciclo)
function analisaCiclo(c, cy){
  const contr=cy.contratadas, util=cy.utilizadas||0;
  const exc=cy.excedidas!=null?cy.excedidas:(contr!=null?Math.max(0,util-contr):0);
  const usoPct = contr? util/contr*100 : 0;
  const un = (c.periodicidade==='Mensal') ? 'semana' : 'mês';
  // ritmo e projeção dentro do ciclo
  const pts=(cy.serie||[]).filter(s=>s.util!=null);
  const lancados=pts.filter(s=>s.util>0).length || pts.length || 1;
  const ritmo = util/lancados;
  let proj = ritmo*(cy.serie?cy.serie.length:lancados);
  if(exc>0 || (contr && util>contr)) proj=Math.max(proj,util);
  const projPct = contr? proj/contr*100 : 0;
  let nivel,farolTxt,rtitle,rec;
  const valReal=(cy.valor_excedido!=null&&cy.valor_excedido>0)?cy.valor_excedido:(cy.valor_hora&&contr?Math.max(0,util-contr)*cy.valor_hora:null);
  if(contr==null){ nivel='na';farolTxt='Sem banco';rtitle='Banco não informado';
    rec=`Este ciclo não traz o total de horas contratadas. Foram lançadas <b>${fmtH(util)}</b>.`; }
  else if(util>contr || exc>0 || projPct>=100){
    nivel='crit';farolTxt='Possível aditivo';rtitle='Sinaliza possível aditivo';
    const rs=valReal!=null?fmtR(valReal):null;
    rec=`O consumo já passou do banco de ${fmtH(contr)} (<b>${fmtH(util)}</b> lançadas). Já há <b>${fmtH(Math.max(0,util-contr))}</b> de horas excedentes${rs?`, no valor de <b>${rs}</b> (conforme a planilha)`:''}, o que sinaliza um possível aditivo de horas para o próximo ciclo.`;
  } else if(projPct>=80){
    nivel='warn';farolTxt='Atenção';rtitle='Caminho de atenção';
    rec=`No ritmo de <b>${fmtH(ritmo)} por ${un}</b>, a projeção é fechar em <b>${fmtH(proj)}</b> (<b>${projPct.toFixed(0)}%</b> do banco). Ainda dentro do contratado, mas seguindo nesse caminho fica próximo do limite.`;
  } else {
    nivel='ok';farolTxt='Saudável';rtitle='Dentro do contratado';
    rec=`No ritmo de <b>${fmtH(ritmo)} por ${un}</b>, a projeção é fechar em <b>${fmtH(proj)}</b> (<b>${projPct.toFixed(0)}%</b> do banco de ${fmtH(contr)}). Consumo confortável dentro do contratado.`;
  }
  return {contr,util,exc,usoPct,proj,projPct,ritmo,nivel,farolTxt,rtitle,rec,valReal,
          restantes: contr!=null?contr-util:null};
}

// texto de cobrança sob o excedente: "a cobrar em DD/MM (faltam N dias)"
function cobrancaTxt(cy){
  const fim=cy&&cy.fim; if(!fim) return '';
  const m=String(fim).match(/(\d{2})\/(\d{2})\/(\d{4})/); if(!m) return '';
  const dtFim=new Date(+m[3],+m[2]-1,+m[1]);
  return `<div style="font-size:11px;color:var(--muted2);margin-top:4px">cobrado no fechamento do ciclo em ${dtFim.toLocaleDateString('pt-BR')}</div>`;
}

// monta o corpo do detalhe (msub + cards + recomendação + gráfico) para UM ciclo
function corpoCiclo(c, cy){
  const a=analisaCiclo(c,cy);
  // unidade dos pontos = o que a série do ciclo realmente traz (Semana ou Mês)
  const primeiro=(cy.serie&&cy.serie[0]&&String(cy.serie[0].periodo||'').toLowerCase())||'';
  const un = primeiro.startsWith('semana') ? 'S' : (primeiro.startsWith('mês')||primeiro.startsWith('mes')) ? 'M' : (c.periodicidade==='Mensal'?'S':'M');
  const vig = (cy.ini&&cy.fim)? `vigência ${cy.ini} a ${cy.fim}` : vigenciaTxt(c);
  const msub = `Contrato ${c.periodicidade.toLowerCase()} · ${vig}${cy.valor_hora?' · hora excedente '+fmtR(cy.valor_hora):''}`;
  const cards = `
      <div class="mstat"><div class="l">Contratadas</div><div class="v tnum">${fmtH(a.contr)}</div></div>
      <div class="mstat"><div class="l">Utilizadas</div><div class="v tnum">${fmtH(a.util)}</div></div>
      <div class="mstat"><div class="l">Restantes</div><div class="v tnum">${fmtH(a.restantes)}</div></div>
      <div class="mstat"><div class="l">% usado</div><div class="v tnum">${a.contr?a.usoPct.toFixed(1)+'%':'—'}</div></div>
      <div class="mstat"><div class="l">Ritmo médio</div><div class="v tnum">${fmtH(a.ritmo)}</div></div>
      <div class="mstat"><div class="l">Projeção fim</div><div class="v tnum">${fmtH(a.proj)}</div></div>
      ${(a.exc>0)?`<div class="mstat"><div class="l">Horas excedidas</div><div class="v tnum">${fmtH(a.exc)}</div></div>`:''}
      ${(a.valReal!=null&&a.valReal>0)?`<div class="mstat"><div class="l">Excedente a cobrar</div><div class="v tnum" style="color:var(--crit)">${fmtR(a.valReal)}</div></div>`:''}`;
  return `
    <div class="msub">${msub}</div>
    <div class="mgrid">${cards}</div>
    <div class="recbox">
      <div class="rtitle"><span class="farol ${a.nivel}">${a.farolTxt}</span> ${a.rtitle}</div>
      <div>${a.rec}</div>
    </div>
    <div class="chartwrap">
      <div class="ctitle">Evolução do consumo</div>
      __ABAS__
      <div id="chartArea">${sparkline(c, cy.serie||[], cy.contratadas, un)}</div>
    </div>`;
}

function abreModal(c,a){
  const m=document.getElementById('modal');
  // usa os ciclos se houver; senão monta um "ciclo" a partir do próprio c (ciclo atual)
  const cs=(c.ciclos&&c.ciclos.length)?c.ciclos:[{
    rotulo:'Ciclo atual', ini:(cicloDatas(c)||{}).ini, fim:(cicloDatas(c)||{}).fim,
    contratadas:c.contratadas, utilizadas:c.utilizadas, excedidas:c.excedidas,
    valor_hora:c.valor_hora, valor_excedido:c.valor_excedido, atual:true, serie:(c.serie||[])
  }];
  const atualIdx=Math.max(0, cs.findIndex(x=>x.atual));
  const abas = cs.length>1 ? `<div class="cabas">${cs.map((cy,i)=>`<button data-ci="${i}">${cy.rotulo}</button>`).join('')}</div>` : '';
  const render=(i)=>{
    m.querySelector('#detalheCorpo').innerHTML = corpoCiclo(c,cs[i]).replace('__ABAS__', abas);
    const wrap=m.querySelector('.cabas');
    if(wrap){ wrap.querySelectorAll('button').forEach((b,bi)=>{b.classList.toggle('sel',bi===i); b.onclick=()=>render(bi);}); }
  };
  m.innerHTML=`
    <button class="x" onclick="fecha()" aria-label="Fechar">×</button>
    <h3>${c.nome}</h3>
    <div id="detalheCorpo"></div>`;
  render(atualIdx);
  document.getElementById('overlay').classList.add('on');
}

// (compat) mantidas para não quebrar chamadas antigas
function abasCiclos(c){ return ''; }
function ligarAbasCiclos(c){
  const cs=c.ciclos||[]; if(cs.length<=1) return;
  const wrap=document.querySelector('.cabas'); if(!wrap) return;
  const atualIdx = Math.max(0, cs.findIndex(x=>x.atual));
  const render=(i)=>{
    const cy=cs[i];
    const un = (c.periodicidade==='Mensal') ? 'S' : 'M';
    document.getElementById('chartArea').innerHTML = sparkline(c, cy.serie||[], cy.contratadas, un);
    wrap.querySelectorAll('button').forEach((b,bi)=>b.classList.toggle('sel',bi===i));
  };
  wrap.querySelectorAll('button').forEach((b,bi)=>b.onclick=()=>render(bi));
  render(atualIdx);  // começa no ciclo atual
}
function fecha(){document.getElementById('overlay').classList.remove('on');}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')fecha();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecha();});

/* SVG sparkline/área da série + linha do banco contratado.
   Aceita override de série/banco/unidade para renderizar um ciclo específico. */
function sparkline(c, serieOverride, bancoOverride, unMes){
  const s=serieOverride||c.serie||[]; if(!s.length) return '<div style="color:var(--muted)">Sem lançamentos neste ciclo.</div>';
  const W=680,H=200,pl=44,pr=14,pt=16,pb=28;
  const banco=(bancoOverride!=null?bancoOverride:c.contratadas)||0;
  const unidadePonto = unMes || (unidadeCiclo(c)==='mês'?'M':'S');
  const maxY=Math.max(banco, ...s.map(p=>p.util||0), 1)*1.05;
  const xs=i=> pl + (s.length===1?0:i*(W-pl-pr)/(s.length-1));
  const ys=v=> H-pb - v/maxY*(H-pt-pb);
  const pts=s.map((p,i)=>[xs(i),ys(p.util)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${xs(0).toFixed(1)} ${(H-pb).toFixed(1)} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${xs(s.length-1).toFixed(1)} ${(H-pb).toFixed(1)} Z`;
  // ticks Y (0 e banco, se houver)
  const gy = banco>0 ? [0,banco] : [0, Math.max(...s.map(p=>p.util||0),1)];
  const yticks=gy.map(v=>`<line x1="${pl}" y1="${ys(v).toFixed(1)}" x2="${W-pr}" y2="${ys(v).toFixed(1)}" stroke="rgba(255,255,255,.08)"/>
     <text x="${pl-8}" y="${(ys(v)+4).toFixed(1)}" fill="var(--muted2)" font-size="11" text-anchor="end">${v.toFixed(0)}h</text>`).join('');
  // linha do banco contratado (só se houver)
  let bankLine='';
  if(banco>0){
    const yBank=ys(banco);
    bankLine=`<line x1="${pl}" y1="${yBank.toFixed(1)}" x2="${W-pr}" y2="${yBank.toFixed(1)}" stroke="var(--crit)" stroke-dasharray="5 4" stroke-width="1.3"/>
      <text x="${W-pr}" y="${(yBank-6).toFixed(1)}" fill="var(--crit)" font-size="11" text-anchor="end">banco contratado ${banco.toFixed(0)}h</text>`;
  }
  const last=pts[pts.length-1];
  // acha o período em que o ACUMULADO estourou o banco (primeira vez que soma corrente > banco)
  let idxEstouro=-1;
  if(banco>0){
    let acc=0;
    for(let i=0;i<s.length;i++){ acc+=(s[i].util||0); if(acc>banco){ idxEstouro=i; break; } }
  }
  // bolinhas em todos os pontos; valor só nos que têm consumo (>0), para não poluir
  const dots=pts.map((p,i)=>{
    const v=s[i].util||0;
    const estouro = (i===idxEstouro);
    const cor = estouro ? 'var(--crit)' : 'var(--gold)';
    const r = estouro ? 6 : (i===pts.length-1?4.5:3);
    const dot=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${cor}"${estouro?' stroke="#fff" stroke-width="1.5"':''}/>`;
    const lbl=(v>0)?`<text x="${p[0].toFixed(1)}" y="${(p[1]-9).toFixed(1)}" fill="${estouro?'var(--crit)':'var(--txt)'}" font-size="10.5" font-weight="${estouro?'800':'600'}" text-anchor="middle">${fmtH(v)}</text>`:'';
    return dot+lbl;
  }).join('');
  // marcador vertical no ponto de estouro (só a linha tracejada; a bola vermelha é feita nos dots)
  let marcaEstouro='';
  if(idxEstouro>=0){
    const px=pts[idxEstouro][0];
    marcaEstouro=`<line x1="${px.toFixed(1)}" y1="${pt}" x2="${px.toFixed(1)}" y2="${H-pb}" stroke="var(--crit)" stroke-dasharray="3 3" stroke-width="1" opacity=".55"/>`;
  }
  // rótulos do eixo X: número do período (1,2,3...) por baixo de cada ponto
  const xlabels=pts.map((p,i)=>{
    // mostra o rótulo curto (ex "M1","S3") — evita sobreposição em séries longas
    const step = s.length>14 ? Math.ceil(s.length/13) : 1;
    if(i%step!==0 && i!==pts.length-1) return '';
    const rot=String(s[i].periodo||''); const m=rot.match(/(\d+)/);
    return `<text x="${p[0].toFixed(1)}" y="${H-8}" fill="var(--muted2)" font-size="10" text-anchor="middle">${unidadePonto}${m?m[1]:(i+1)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do consumo de horas">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="var(--gold)" stop-opacity=".28"/>
      <stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>
    ${yticks}
    ${bankLine}
    ${marcaEstouro}
    <path d="${area}" fill="url(#g)"/>
    <path d="${line}" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${xlabels}
  </svg>`;
}

document.getElementById('hoje').textContent =
  new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});

function pinta(clientes){
  if(!clientes || !clientes.length){document.getElementById('empty').hidden=false;return;}
  const ans=clientes.map(analisa);
  CLIENTES=clientes; ANS=ans;
  renderKpis(clientes,ans);
  renderTabela(clientes,ans);
  ligarControles();
}
